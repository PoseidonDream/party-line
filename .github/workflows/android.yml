# Builds the Party Line Android app: an .apk you can install on any Android phone, and (when it's signed) an .aab
# bundle for Google Play (see app/PLAY_STORE.md).
# Run it from the Actions tab ("Run workflow"), or push a tag like android-v1.0.1 to publish a release.
# Needs the repository variable PARTY_LINE_SERVER (your server's address), like the desktop app.
# Optional signing secrets (see app/SIGNING.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths: ['app/mobile/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Point the app at your server
        if: vars.PARTY_LINE_SERVER != ''
        run: node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "${{ vars.PARTY_LINE_SERVER }}"
      - run: npx cap sync android
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PL_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key set, so this is a debug build. Phones can install it, but to update later they must uninstall first. See app/SIGNING.md."
          fi
      - name: Check the signing key
        if: env.PL_KEYSTORE != ''
        env:
          PL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A clear message for each usual mistake, instead of a long error from the build.
          ks=(-keystore "$PL_KEYSTORE" -storepass "$PL_KEYSTORE_PASSWORD")
          if ! keytool -list "${ks[@]}" >/dev/null 2>&1; then
            echo "::error title=Signing key::ANDROID_KEYSTORE_PASSWORD doesn't open the key file (or ANDROID_KEYSTORE_BASE64 isn't the whole file). Set it again with gh secret set (see app/SIGNING.md)."; exit 1
          fi
          if ! keytool -list "${ks[@]}" -alias "$PL_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error title=Signing key::The key file has no key called \"$PL_KEY_ALIAS\" (ANDROID_KEY_ALIAS). It has: $(keytool -list "${ks[@]}" 2>/dev/null | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' ')"; exit 1
          fi
          if ! keytool -certreq "${ks[@]}" -alias "$PL_KEY_ALIAS" -keypass "$PL_KEY_PASSWORD" -file /dev/null >/dev/null 2>&1; then
            echo "::error title=Signing key::ANDROID_KEY_PASSWORD is wrong. If you pressed Enter when keytool asked for a key password, it is the same as ANDROID_KEYSTORE_PASSWORD."; exit 1
          fi
          echo "The signing key and both passwords work."
      - name: Build
        working-directory: app/mobile/android
        env:
          PL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PL_VERSION_CODE: ${{ github.run_number }}
          PL_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/android-v') && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          # The bundle is built either way (so a broken one shows up early), but only a signed one is kept: Play takes no other.
          if [ -n "$PL_KEYSTORE" ]; then tasks="assembleRelease bundleRelease"; else tasks="assembleDebug bundleRelease"; fi
          # If it fails, the reason goes in the run's summary (GitHub's own log only says "exit code 1").
          set +e; ./gradlew --no-daemon $tasks 2>&1 | tee "$RUNNER_TEMP/gradle.log"; ok=${PIPESTATUS[0]}; set -e
          if [ "$ok" != 0 ]; then
            echo "::error title=Android build failed::$( (grep -A12 'What went wrong' "$RUNNER_TEMP/gradle.log" || tail -20 "$RUNNER_TEMP/gradle.log") | head -24 | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"
            exit "$ok"
          fi
          mkdir -p ../dist ../play
          cp app/build/outputs/apk/*/*.apk "../dist/Party-Line-${PL_VERSION_NAME#android-v}.apk"
          # Google Play takes a signed bundle (.aab) instead of an .apk.
          if [ -n "$PL_KEYSTORE" ]; then cp app/build/outputs/bundle/release/*.aab "../play/Party-Line-${PL_VERSION_NAME#android-v}.aab"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: party-line-android
          path: app/mobile/dist/*.apk
      - name: The Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: party-line-google-play
          path: app/mobile/play/*.aab
          if-no-files-found: ignore
      - name: Add it to the newest release
        # Started from the Actions tab: put the .apk next to the desktop installers on the Releases page.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null) || { echo "::warning::No release yet; build the desktop app first, or download the .apk from this run."; exit 0; }
          cp dist/*.apk dist/Party-Line-android.apk
          # The label carries the build number, which the app compares with its own to offer updates.
          gh release upload "$tag" "dist/Party-Line-android.apk#Party Line for Android (build ${{ github.run_number }})" --clobber -R "$GITHUB_REPOSITORY"
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/mobile/dist/*.apk
