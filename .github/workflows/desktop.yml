# Builds the Party Line desktop app (Windows installer, Mac disk image, Linux AppImage) and publishes
# them as a GitHub release. Run it from the Actions tab ("Run workflow"), or push a tag like desktop-v1.0.1.
# Set the repository variable PARTY_LINE_SERVER (Settings → Secrets and variables → Actions → Variables)
# to your server's address, e.g. https://partyline.example.com, so the app connects without asking.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    # Changes to the desktop app are test-built (not published) so problems show up early.
    branches: [app]
    paths: ['app/desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_MAC_SIGNING: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm ci
      - name: Use the version from the tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"
      - name: Point the app at your server
        if: vars.PARTY_LINE_SERVER != ''
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.partyLine.server=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2))" "${{ vars.PARTY_LINE_SERVER }}"
      # Optional code signing (see app/SIGNING.md). Without it the installers still work,
      # but Windows and Mac warn that the app is from an unknown developer.
      - name: Windows signing (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        run: |
          node -e "const f='package.json',p=require('./'+f);p.build.win.azureSignOptions={publisherName:process.argv[1],endpoint:process.argv[2],codeSigningAccountName:process.argv[3],certificateProfileName:process.argv[4]};require('fs').writeFileSync(f,JSON.stringify(p,null,2))" \
            "${{ vars.AZURE_PUBLISHER_NAME }}" "${{ vars.AZURE_SIGNING_ENDPOINT }}" "${{ vars.AZURE_SIGNING_ACCOUNT }}" "${{ vars.AZURE_CERT_PROFILE }}"
      - name: Mac signing and notarizing
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING == 'true'
        shell: bash
        run: |
          node -e "const f='package.json',p=require('./'+f);p.build.mac.notarize=true;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder --publish never 2>&1 | tee build.log; then
            # Show the end of the log as annotations, so the reason is visible on the run's summary page.
            echo "::error title=Build failed::$(grep -vE '^\s+at ' build.log | tail -15 | awk '{sub(/\r$/,""); gsub(/%/,"%25"); printf "%s%%0A", $0}')"
            exit 1
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_IDENTITY_AUTO_DISCOVERY || 'false' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Read the version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            app/desktop/dist/*.exe
            app/desktop/dist/*.dmg
            app/desktop/dist/*.zip
            app/desktop/dist/*.AppImage
            app/desktop/dist/*.deb
            app/desktop/dist/*.blockmap
            app/desktop/dist/latest*.yml
          if-no-files-found: error
    outputs:
      version: ${{ steps.ver.outputs.version }}

  # One job publishes every installer together, so the three builds never race to create the release.
  # The auto-updater reads latest*.yml from the newest release.
  release:
    needs: build
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Party Line ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
