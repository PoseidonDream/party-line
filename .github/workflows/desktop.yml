# Builds the Party Line desktop app (Windows installer, Mac disk image, Linux AppImage) and publishes
# them as a GitHub release. Run it from the Actions tab ("Run workflow"), or push a tag like desktop-v1.0.1.
# Set the repository variable PARTY_LINE_SERVER (Settings → Secrets and variables → Actions → Variables)
# to your server's address, e.g. https://partyline.example.com, so the app connects without asking.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/desktop/package-lock.json
      - run: npm ci
      - name: Use the version from the tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#desktop-v}"
      - name: Point the app at your server
        if: vars.PARTY_LINE_SERVER != ''
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.partyLine.server=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(p,null,2))" "${{ vars.PARTY_LINE_SERVER }}"
      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
