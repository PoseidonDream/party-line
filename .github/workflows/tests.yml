# Runs the browser tests (app/tests) on every change to the app: real Chromium windows sign up,
# chat, talk in voice and share screens against a real Party Line server.
name: Tests

on:
  push:
    paths: ['app/server/**', 'app/web/**', 'app/tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['app/server/**', 'app/web/**', 'app/tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app/server
      - run: npm ci
        working-directory: app/tests
      - run: npx playwright-core install --with-deps chromium
        working-directory: app/tests
      - run: npm test
        working-directory: app/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: app/tests/results/
          if-no-files-found: ignore
