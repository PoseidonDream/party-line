# Runs the browser tests (app/tests) on every change to the app: real Chromium windows sign up,
# chat, talk in voice and share screens against a real Party Line server.
name: Tests

on:
  push:
    paths: ['app/server/**', 'app/web/**', 'app/tests/**', 'app/desktop/package*.json', 'app/mobile/package*.json', '.github/workflows/tests.yml']
  pull_request:
    paths: ['app/server/**', 'app/web/**', 'app/tests/**', 'app/desktop/package*.json', 'app/mobile/package*.json', '.github/workflows/tests.yml']
  schedule:
    - cron: '17 6 * * 1'   # every Monday: new security problems get found in packages that didn't change
  workflow_dispatch:

jobs:
  # The packages the server, desktop app and Android app ship with: fails if any has a known serious security
  # problem (GitHub then emails you; update with `npm audit fix` or a newer version). Build tools are left out.
  package-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Known security problems in shipped packages
        shell: bash
        run: |
          fail=0
          for d in app/server app/desktop app/mobile; do
            echo "== $d"; (cd $d && npm audit --omit=dev --audit-level=high) || { fail=1; echo "::error title=Security problem in $d packages::Run npm audit in $d"; }
          done
          exit $fail

  browser-tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app/server
      - run: npm ci
        working-directory: app/tests
      - run: npm ci   # Capacitor's bridge script, for the Android app test
        working-directory: app/mobile
      - run: npx playwright-core install --with-deps chromium
        working-directory: app/tests
      - name: Tests with voice going directly between people
        working-directory: app/tests
        run: set +e; npm test 2>&1 | tee direct.log; ok=${PIPESTATUS[0]}; [ $ok = 0 ] || echo "::error title=Failed tests::$( (grep -B1 -A2 '✗' direct.log || tail -20 direct.log) | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"; exit $ok
        shell: bash
      - name: Tests with voice going through the media server
        working-directory: app/tests
        run: |
          curl -sSL https://github.com/livekit/livekit/releases/download/v1.8.4/livekit_1.8.4_linux_amd64.tar.gz | tar xz livekit-server
          set +e; PL_LIVEKIT=$PWD/livekit-server npm test 2>&1 | tee sfu.log; ok=${PIPESTATUS[0]}
          [ $ok = 0 ] || echo "::error title=Failed tests (media server)::$( (grep -B1 -A2 '✗' sfu.log || tail -20 sfu.log) | awk '{gsub(/%/,"%25"); printf "%s%%0A", $0}')"; exit $ok
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: app/tests/results/
          if-no-files-found: ignore
