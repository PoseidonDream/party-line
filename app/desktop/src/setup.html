<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Party Line</title><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'"><link rel="stylesheet" href="shared.css"></head>
<body>
<main class="wrap">
  <form class="card" id="f">
    <h1>Party <span>Line</span></h1>
    <p>Enter your group's Party Line address. Whoever runs your server can tell you what it is.</p>
    <div><label for="url">Server address</label><input id="url" placeholder="e.g. partyline.example.com" autocomplete="url" autocapitalize="off" spellcheck="false" required></div>
    <p class="error" id="err" hidden></p>
    <button id="go">Connect</button>
  </form>
</main>
<script src="setup.js"></script>
</body>
</html>
