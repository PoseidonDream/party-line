<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Figtree:wght@500;600&family=JetBrains+Mono:wght@600&display=block">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; background: #000; color: #f2f3f6; overflow: hidden; }
  .wrap { position: relative; width: 1024px; height: 500px; display: flex; align-items: center; padding: 0 72px; box-sizing: border-box; }
  h1 { margin: 0; font: 800 150px/.84 "Big Shoulders Display", Impact, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
  h1 span { display: block; }
  h1 .lit { color: #ffbd4a; text-shadow: 0 0 36px rgba(255, 173, 31, .55); }
  .text { position: relative; z-index: 1; }
  p { margin: 26px 0 0; font: 500 27px/1.3 Figtree, sans-serif; max-width: 470px; }
  small { display: block; margin-top: 18px; font: 600 15px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: #8b93a3; }
  .jacks { position: absolute; right: 64px; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(6, 46px); gap: 22px; }
  .jacks i { width: 46px; height: 46px; border-radius: 50%; background: #0b0d12; box-shadow: inset 0 0 0 7px #1b1f28, inset 0 0 0 13px #000; }
  .jacks i.on { box-shadow: inset 0 0 0 7px #ffad1f, inset 0 0 0 13px #000, 0 0 22px rgba(255, 173, 31, .6); }
</style></head>
<body><div class="wrap">
  <div class="text">
    <h1><span>Party</span><span class="lit">Line</span></h1>
    <p>Voice, chat and screen sharing for your friend group.</p>
    <small>Your own server · No ads</small>
  </div>
  <div class="jacks"><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i></div>
</div></body></html>
