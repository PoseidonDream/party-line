# Party Line on one small server: the app, Caddy for automatic HTTPS, and a TURN relay so voice
# works for friends on strict networks. Fill in deploy/.env (see .env.example), then:
#   docker compose up -d --build
services:
  partyline:
    build:
      context: ../app
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    environment:
      GROUP_PASSWORD: ${GROUP_PASSWORD}
      ADMIN_NAMES: ${ADMIN_NAMES:-Poseidon}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET}
      TRUST_PROXY: "1"
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_KEY: ${LIVEKIT_KEY:-}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASK_MODEL: ${ASK_MODEL:-}
      ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-}
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - partyline-data:/data

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - partyline

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  # Optional media server for voice channels with more than about 10 people.
  # Turn it on with ./voice-server.sh on (it sets COMPOSE_PROFILES=sfu and LIVEKIT_URL in .env).
  livekit:
    image: livekit/livekit-server:v1.8.4
    profiles: ["sfu"]
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: warn
        rtc:
          tcp_port: 7881
          udp_port: 7882
          node_ip: ${PUBLIC_IP}
          use_external_ip: false
        room:
          empty_timeout: 60

volumes:
  partyline-data:
  caddy-data:
  caddy-config:
